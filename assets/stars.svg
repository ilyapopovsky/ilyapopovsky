<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140">
  <defs>
    <!-- Deep space cobalt / indigo gradient matching Spike Spiegel's backdrop -->
    <linearGradient id="deepSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b18" />
      <stop offset="40%" stop-color="#081836" />
      <stop offset="75%" stop-color="#0c2656" />
      <stop offset="100%" stop-color="#123577" />
    </linearGradient>

    <!-- Subtle ambient nebula / smoke glow -->
    <radialGradient id="nebulaGlow" cx="65%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="40%" stop-color="#1d4ed8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#050b18" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hazeGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#081836" stop-opacity="0" />
    </radialGradient>

    <!-- Shooting star gradient trail -->
    <linearGradient id="meteorTail" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Star cross shape definition -->
    <g id="sparkle">
      <path d="M 0,-5 Q 0,0 5,0 Q 0,0 0,5 Q 0,0 -5,0 Q 0,0 0,-5 Z" />
    </g>

    <style>
      .twinkle-slow {
        animation: pulse 4.2s ease-in-out infinite alternate;
      }
      .twinkle-mid {
        animation: pulse 3.0s ease-in-out infinite alternate;
      }
      .twinkle-fast {
        animation: pulse 2.1s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { opacity: 0.2; transform: scale(0.75); }
        50% { opacity: 0.6; }
        100% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes meteor {
        0% {
          transform: translate(0, 0) scale(0);
          opacity: 0;
        }
        3% {
          opacity: 1;
          transform: translate(15px, 6px) scale(1);
        }
        12% {
          opacity: 0;
          transform: translate(220px, 85px) scale(0.4);
        }
        100% {
          opacity: 0;
          transform: translate(220px, 85px) scale(0);
        }
      }
      .meteor-anim {
        animation: meteor 9s ease-out infinite;
        transform-origin: 0 0;
      }
      @keyframes drift {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
        100% { transform: translateY(0px); }
      }
      .smoke-drift {
        animation: drift 7s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Sky Canvas with rounded aesthetic border -->
  <rect width="850" height="140" rx="14" fill="url(#deepSky)" />
  <rect width="850" height="140" rx="14" fill="url(#nebulaGlow)" class="smoke-drift" />
  <rect width="850" height="140" rx="14" fill="url(#hazeGlow)" />

  <!-- Subtle grid / constellation faint lines -->
  <g stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.22">
    <line x1="160" y1="40" x2="220" y2="75" />
    <line x1="220" y1="75" x2="295" y2="35" />
    <line x1="295" y1="35" x2="360" y2="90" />
    <line x1="530" y1="45" x2="590" y2="25" />
    <line x1="590" y1="25" x2="660" y2="65" />
    <line x1="660" y1="65" x2="735" y2="30" />
  </g>

  <!-- Sparkle Stars (4-point retro anime sparkles) -->
  <g fill="#f8fafc" class="twinkle-slow" style="transform-origin: 160px 40px; animation-delay: 0.4s;">
    <use href="#sparkle" x="160" y="40" />
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" begin="0.4s" repeatCount="indefinite" />
  </g>

  <g fill="#38bdf8" class="twinkle-mid" style="transform-origin: 295px 35px; animation-delay: 1.2s;">
    <use href="#sparkle" x="295" y="35" />
    <animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.0s" begin="1.2s" repeatCount="indefinite" />
  </g>

  <g fill="#fef08a" class="twinkle-slow" style="transform-origin: 590px 25px; animation-delay: 0.8s;">
    <use href="#sparkle" x="590" y="25" />
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4.0s" begin="0.8s" repeatCount="indefinite" />
  </g>

  <g fill="#f8fafc" class="twinkle-mid" style="transform-origin: 735px 30px; animation-delay: 2.1s;">
    <use href="#sparkle" x="735" y="30" />
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" begin="2.1s" repeatCount="indefinite" />
  </g>

  <!-- Twinkling Circular Stars (white, cyan, golden ember) -->
  <!-- Cluster Left -->
  <circle cx="45" cy="35" r="1.4" fill="#ffffff" class="twinkle-fast" style="animation-delay: 0.2s;">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" begin="0.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="85" cy="85" r="1.1" fill="#38bdf8" class="twinkle-mid" style="animation-delay: 1.5s;">
    <animate attributeName="opacity" values="0.3;0.95;0.3" dur="3.2s" begin="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="120" cy="25" r="0.9" fill="#f8fafc" class="twinkle-slow" style="animation-delay: 0.9s;">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.5s" begin="0.9s" repeatCount="indefinite" />
  </circle>
  <circle cx="220" cy="75" r="1.5" fill="#fef08a" class="twinkle-mid" style="animation-delay: 0.5s;">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.5s" repeatCount="indefinite" />
  </circle>

  <!-- Cluster Center -->
  <circle cx="360" cy="90" r="1.3" fill="#ffffff" class="twinkle-slow" style="animation-delay: 1.8s;">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" begin="1.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="410" cy="35" r="1.0" fill="#38bdf8" class="twinkle-fast" style="animation-delay: 0.7s;">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.3s" begin="0.7s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="105" r="1.2" fill="#f8fafc" class="twinkle-mid" style="animation-delay: 2.3s;">
    <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.1s" begin="2.3s" repeatCount="indefinite" />
  </circle>
  <circle cx="485" cy="30" r="1.4" fill="#fde047" class="twinkle-slow" style="animation-delay: 1.1s;">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4.4s" begin="1.1s" repeatCount="indefinite" />
  </circle>

  <!-- Cluster Right -->
  <circle cx="530" cy="45" r="1.2" fill="#ffffff" class="twinkle-fast" style="animation-delay: 1.3s;">
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.5s" begin="1.3s" repeatCount="indefinite" />
  </circle>
  <circle cx="620" cy="100" r="1.0" fill="#38bdf8" class="twinkle-mid" style="animation-delay: 0.6s;">
    <animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.4s" begin="0.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="660" cy="65" r="1.5" fill="#fef08a" class="twinkle-slow" style="animation-delay: 2.0s;">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" begin="2.0s" repeatCount="indefinite" />
  </circle>
  <circle cx="780" cy="75" r="1.3" fill="#ffffff" class="twinkle-mid" style="animation-delay: 1.0s;">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" begin="1.0s" repeatCount="indefinite" />
  </circle>
  <circle cx="815" cy="35" r="1.0" fill="#38bdf8" class="twinkle-fast" style="animation-delay: 1.7s;">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="1.7s" repeatCount="indefinite" />
  </circle>

  <!-- Micro Background Stars (Ambient field) -->
  <g fill="#93c5fd" opacity="0.35">
    <circle cx="25" cy="65" r="0.6" />
    <circle cx="65" cy="115" r="0.7" />
    <circle cx="105" cy="45" r="0.5" />
    <circle cx="180" cy="110" r="0.6" />
    <circle cx="250" cy="20" r="0.7" />
    <circle cx="320" cy="70" r="0.5" />
    <circle cx="380" cy="20" r="0.6" />
    <circle cx="430" cy="70" r="0.7" />
    <circle cx="510" cy="115" r="0.5" />
    <circle cx="560" cy="60" r="0.6" />
    <circle cx="630" cy="25" r="0.7" />
    <circle cx="700" cy="105" r="0.5" />
    <circle cx="750" cy="50" r="0.6" />
    <circle cx="830" cy="95" r="0.7" />
  </g>

  <!-- Relaxing Shooting Star (glides smoothly across) -->
  <g class="meteor-anim">
    <line x1="80" y1="20" x2="20" y2="4" stroke="url(#meteorTail)" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="80" cy="20" r="1.6" fill="#ffffff" />
  </g>
</svg>
