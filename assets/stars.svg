<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 28" width="450" height="28" fill="none" shape-rendering="crispEdges">
  <defs>
    <!-- 5x5 Pixel Cross Star -->
    <g id="px-cross">
      <rect x="2" y="0" width="1" height="5" />
      <rect x="0" y="2" width="5" height="1" />
    </g>

    <!-- 3x3 Pixel Plus Star -->
    <g id="px-plus">
      <rect x="1" y="0" width="1" height="3" />
      <rect x="0" y="1" width="3" height="1" />
    </g>

    <style>
      /* 16-bit retro discrete frame animations */
      .anim-a { animation: stepA 2.6s steps(1) infinite; }
      .anim-b { animation: stepB 3.4s steps(1) infinite; }
      .anim-c { animation: stepC 2.0s steps(1) infinite; }
      .anim-d { animation: stepD 4.2s steps(1) infinite; }

      @keyframes stepA { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.95; } }
      @keyframes stepB { 0%, 100% { opacity: 0.9; } 45% { opacity: 0.15; } }
      @keyframes stepC { 0%, 100% { opacity: 0.15; } 60% { opacity: 0.85; } }
      @keyframes stepD { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.25; } }
    </style>
  </defs>

  <!-- 100% Transparent Canvas - No borders, no boxes, completely seamless -->

  <!-- Retro Pixel Crescent Moon (16-bit, soft cream) -->
  <g fill="#fef08a" opacity="0.9" transform="translate(25, 4)">
    <rect x="3" y="0" width="4" height="2" />
    <rect x="1" y="2" width="3" height="2" />
    <rect x="0" y="4" width="2" height="4" />
    <rect x="1" y="8" width="3" height="2" />
    <rect x="3" y="10" width="4" height="2" />
  </g>

  <!-- 5x5 Pixel Cross Stars -->
  <g class="anim-a" fill="#f8fafc" transform="translate(95, 11)">
    <use href="#px-cross" />
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.6s" calcMode="discrete" repeatCount="indefinite" />
  </g>

  <g class="anim-b" fill="#7dd3fc" transform="translate(225, 9)">
    <use href="#px-cross" />
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.4s" calcMode="discrete" repeatCount="indefinite" />
  </g>

  <g class="anim-c" fill="#fef08a" transform="translate(355, 13)">
    <use href="#px-cross" />
    <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.0s" calcMode="discrete" repeatCount="indefinite" />
  </g>

  <!-- 3x3 Pixel Plus Stars -->
  <g class="anim-b" fill="#94a3b8" transform="translate(65, 17)">
    <use href="#px-plus" />
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.4s" calcMode="discrete" repeatCount="indefinite" />
  </g>

  <g class="anim-d" fill="#f8fafc" transform="translate(155, 7)">
    <use href="#px-plus" />
    <animate attributeName="opacity" values="0.85;0.25;0.85" dur="4.2s" calcMode="discrete" repeatCount="indefinite" />
  </g>

  <g class="anim-a" fill="#38bdf8" transform="translate(290, 17)">
    <use href="#px-plus" />
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.6s" calcMode="discrete" repeatCount="indefinite" />
  </g>

  <g class="anim-c" fill="#f8fafc" transform="translate(415, 9)">
    <use href="#px-plus" />
    <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.0s" calcMode="discrete" repeatCount="indefinite" />
  </g>

  <!-- 2x2 Square Pixel Stars -->
  <rect x="52" y="9" width="2" height="2" fill="#7dd3fc" class="anim-c">
    <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.0s" calcMode="discrete" repeatCount="indefinite" />
  </rect>
  <rect x="135" y="12" width="2" height="2" fill="#cbd5e1" class="anim-d">
    <animate attributeName="opacity" values="0.85;0.25;0.85" dur="4.2s" calcMode="discrete" repeatCount="indefinite" />
  </rect>
  <rect x="255" y="13" width="2" height="2" fill="#fef08a" class="anim-a">
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.6s" calcMode="discrete" repeatCount="indefinite" />
  </rect>
  <rect x="325" y="21" width="2" height="2" fill="#94a3b8" class="anim-d">
    <animate attributeName="opacity" values="0.85;0.25;0.85" dur="4.2s" calcMode="discrete" repeatCount="indefinite" />
  </rect>
  <rect x="385" y="7" width="2" height="2" fill="#7dd3fc" class="anim-b">
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.4s" calcMode="discrete" repeatCount="indefinite" />
  </rect>

  <!-- 1x1 Single Pixel Micro-Stars -->
  <rect x="120" y="21" width="1" height="1" fill="#f8fafc" class="anim-a" />
  <rect x="185" y="19" width="1" height="1" fill="#7dd3fc" class="anim-b" />
  <rect x="270" y="7" width="1" height="1" fill="#ffffff" class="anim-c" />
  <rect x="340" y="9" width="1" height="1" fill="#fef08a" class="anim-a" />
  <rect x="435" y="17" width="1" height="1" fill="#f8fafc" class="anim-d" />
</svg>
