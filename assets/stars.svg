<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 50" width="100%" height="50" fill="none">
  <defs>
    <!-- Soft, semi-transparent cosmic aura fading seamlessly to 0% at all edges -->
    <radialGradient id="softAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.36" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="85%" stop-color="#0f172a" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Faint shooting star gradient trail -->
    <linearGradient id="softMeteor" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- 4-point anime sparkle -->
    <g id="sparkle-soft">
      <path d="M 0,-3.5 Q 0,0 3.5,0 Q 0,0 0,3.5 Q 0,0 -3.5,0 Q 0,0 0,-3.5 Z" />
    </g>

    <style>
      .tw-slow { animation: softTwinkle 3.8s ease-in-out infinite alternate; }
      .tw-mid { animation: softTwinkle 2.6s ease-in-out infinite alternate; }
      .tw-fast { animation: softTwinkle 1.9s ease-in-out infinite alternate; }

      @keyframes softTwinkle {
        0% { opacity: 0.15; transform: scale(0.7); }
        50% { opacity: 0.55; }
        100% { opacity: 0.95; transform: scale(1.15); }
      }

      @keyframes meteorGlide {
        0% {
          transform: translate(0, 0) scale(0);
          opacity: 0;
        }
        4% {
          opacity: 0.9;
          transform: translate(15px, 6px) scale(1);
        }
        14% {
          opacity: 0;
          transform: translate(120px, 40px) scale(0.3);
        }
        100% {
          opacity: 0;
          transform: translate(120px, 40px) scale(0);
        }
      }
      .meteor-soft {
        animation: meteorGlide 8.5s ease-out infinite;
        transform-origin: 0 0;
      }
    </style>
  </defs>

  <!-- Completely semi-transparent aura: no box, no border, melts into GitHub background -->
  <ellipse cx="325" cy="25" rx="300" ry="22" fill="url(#softAura)" />

  <!-- Subtle constellation threads -->
  <g stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.22">
    <line x1="130" y1="28" x2="190" y2="17" />
    <line x1="190" y1="17" x2="255" y2="32" />
    <line x1="395" y1="18" x2="455" y2="33" />
    <line x1="455" y1="33" x2="520" y2="17" />
  </g>

  <!-- 4-point Anime Sparkles -->
  <g class="tw-slow" fill="#f8fafc" style="transform-origin: 190px 17px; animation-delay: 0.3s;">
    <use href="#sparkle-soft" x="190" y="17" />
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.8s" begin="0.3s" repeatCount="indefinite" />
  </g>
  <g class="tw-mid" fill="#38bdf8" style="transform-origin: 325px 22px; animation-delay: 1.2s;">
    <use href="#sparkle-soft" x="325" y="22" />
    <animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="1.2s" repeatCount="indefinite" />
  </g>
  <g class="tw-slow" fill="#fef08a" style="transform-origin: 455px 33px; animation-delay: 0.7s;">
    <use href="#sparkle-soft" x="455" y="33" />
    <animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.4s" begin="0.7s" repeatCount="indefinite" />
  </g>
  <g class="tw-mid" fill="#ffffff" style="transform-origin: 520px 17px; animation-delay: 1.8s;">
    <use href="#sparkle-soft" x="520" y="17" />
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" begin="1.8s" repeatCount="indefinite" />
  </g>

  <!-- Twinkling stars (soft white, cyan, warm ember) -->
  <circle cx="90" cy="26" r="1.1" fill="#38bdf8" class="tw-fast" style="animation-delay: 0.2s;">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.0s" begin="0.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="130" cy="28" r="1.2" fill="#ffffff" class="tw-mid" style="animation-delay: 0.8s;">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" begin="0.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="255" cy="32" r="1.2" fill="#fde047" class="tw-slow" style="animation-delay: 1.5s;">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" begin="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="290" cy="15" r="0.8" fill="#93c5fd" class="tw-fast" style="animation-delay: 0.5s;">
    <animate attributeName="opacity" values="0.15;0.75;0.15" dur="2.1s" begin="0.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="365" cy="33" r="1.0" fill="#ffffff" class="tw-mid" style="animation-delay: 1.1s;">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" begin="1.1s" repeatCount="indefinite" />
  </circle>
  <circle cx="395" cy="18" r="1.2" fill="#38bdf8" class="tw-slow" style="animation-delay: 1.9s;">
    <animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.7s" begin="1.9s" repeatCount="indefinite" />
  </circle>
  <circle cx="560" cy="30" r="1.1" fill="#fde047" class="tw-fast" style="animation-delay: 0.4s;">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.2s" begin="0.4s" repeatCount="indefinite" />
  </circle>

  <!-- Ambient micro-stars -->
  <g fill="#93c5fd" opacity="0.3">
    <circle cx="60" cy="20" r="0.5" />
    <circle cx="160" cy="36" r="0.5" />
    <circle cx="220" cy="13" r="0.6" />
    <circle cx="340" cy="14" r="0.5" />
    <circle cx="430" cy="38" r="0.6" />
    <circle cx="490" cy="13" r="0.5" />
    <circle cx="590" cy="22" r="0.5" />
  </g>

  <!-- Gentle shooting star gliding softly -->
  <g class="meteor-soft">
    <line x1="240" y1="11" x2="205" y2="4" stroke="url(#softMeteor)" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="240" cy="11" r="1.1" fill="#ffffff" />
  </g>
</svg>
